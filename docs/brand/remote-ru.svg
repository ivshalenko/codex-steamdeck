<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Компьютер отправляет задачу. Steam Deck выполняет её.</title>
  <desc id="desc">Mac, Windows или Linux подключается по SSH. Codex и чат работают на Steam Deck. Оба устройства должны быть включены и доступны.</desc>
  <rect x="1" y="1" width="1198" height="238" rx="20" fill="#111b26" stroke="#304252"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="46" font-size="12" letter-spacing="2" fill="#a8e1fa">КОМПЬЮТЕР → DECK</text>
    <text x="48" y="101" font-size="29" font-weight="700" fill="#f1f7fb">Ваш Mac / ПК</text>
    <text x="48" y="135" font-size="17" fill="#a8bdce">Отправьте задачу. Продолжите чат.</text>
    <text x="850" y="101" font-size="29" font-weight="700" fill="#f1f7fb">Steam Deck</text>
    <text x="850" y="135" font-size="17" fill="#a8bdce">Codex работает здесь.</text>
    <text x="600" y="88" font-size="13" text-anchor="middle" fill="#a8e1fa" letter-spacing="1.3">SSH · ВАШ КЛЮЧ</text>
    <text x="600" y="150" font-size="13" text-anchor="middle" fill="#a8bdce">ЗАДАЧА →  /  ← ОТВЕТ</text>
    <path d="M420 112h340m-10-8 10 8-10 8" fill="none" stroke="#a8e1fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M48 177h1104" stroke="#304252"/>
    <text x="48" y="212" font-size="14" fill="#a8bdce">Одна доступная сеть · Оба устройства включены · Вне дома — через собственный VPN</text>
  </g>
</svg>
