</g><text x="948" y="263" fill="#f1f7fb" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Codex работает здесь</text><path d="M52 287H1148" stroke="#304252"/><text x="48" y="322" fill="#a8bdce" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" >Одна доступная сеть · Оба устройства включены · Вне дома — ваш VPN</text></svg>
