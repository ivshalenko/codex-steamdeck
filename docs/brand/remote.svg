<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Your computer sends the task. Your Steam Deck runs it.</title>
  <desc id="desc">Mac, Windows or Linux connects over SSH. Codex and the conversation run on Steam Deck. Both devices stay awake and reachable.</desc>
  <rect x="1" y="1" width="1198" height="238" rx="20" fill="#111b26" stroke="#304252"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="46" font-size="12" letter-spacing="2" fill="#a8e1fa">COMPUTER → DECK</text>
    <text x="48" y="101" font-size="29" font-weight="700" fill="#f1f7fb">Your Mac / PC</text>
    <text x="48" y="135" font-size="17" fill="#a8bdce">Send a task. Continue the chat.</text>
    <text x="850" y="101" font-size="29" font-weight="700" fill="#f1f7fb">Steam Deck</text>
    <text x="850" y="135" font-size="17" fill="#a8bdce">Codex runs here.</text>
    <text x="600" y="88" font-size="13" text-anchor="middle" fill="#a8e1fa" letter-spacing="1.3">SSH · YOUR KEY</text>
    <text x="600" y="150" font-size="13" text-anchor="middle" fill="#a8bdce">TASK →  /  ← REPLY</text>
    <path d="M420 112h340m-10-8 10 8-10 8" fill="none" stroke="#a8e1fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M48 177h1104" stroke="#304252"/>
    <text x="48" y="212" font-size="14" fill="#a8bdce">Same reachable network · Keep both devices awake · Your own VPN for access away from home</text>
  </g>
</svg>
