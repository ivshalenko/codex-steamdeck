name: Test and package Deck AI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: decky/package-lock.json
      - name: Install FFmpeg for real media regression checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt
      - run: npm --prefix decky ci --ignore-scripts
      - run: python scripts/build-release.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: deck-ai-release-candidate
          path: build/releases/*
          if-no-files-found: error
